<body>
<header>
<h1>Molecular Mass Calculator</h1>
<p>by <a href="https://www.cgohlke.com">Christoph Gohlke</a></p>
</header>
<main>
<form id="molmass" method="get">
<div><label for="q"><strong>Formula:</strong></label></div>
<div class="formula">
<input type="text" name="q" id="q" value="" disabled>
</div>
<div class="buttons">
<input type="submit" id="a" value="Submit" disabled>
<input type="reset" id="r" value="Reset">
</div>
</form>
<p id="loading">Loading Pyodide&#8230;</p>
<div class="content"></div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
(async () => {
  const content = document.querySelector('.content');
  const loading = document.getElementById('loading');
  const inputQ = document.getElementById('q');
  const submitBtn = document.getElementById('a');
  const form = document.getElementById('molmass');

  let pyAnalyze, pyIsotopes, pyGroups, help = '', version = '';

  async function init() {
    try {
      const pyodide = await loadPyodide();
      loading.textContent = 'Installing molmass\u2026';
      await pyodide.loadPackage('micropip');
      const micropip = pyodide.pyimport('micropip');
      await micropip.install('molmass');
      await pyodide.runPythonAsync(`
from molmass import __version__
from molmass.web import HELP, analyze, groups, isotopes

help_ = HELP.format(version=__version__)
`);
      pyAnalyze = pyodide.globals.get('analyze');
      pyIsotopes = pyodide.globals.get('isotopes');
      pyGroups = pyodide.globals.get('groups');
      version = pyodide.runPython('__version__');
      help = pyodide.runPython('help_');
      // document.title = `Molecular Mass Calculator v${version}`;
      loading.style.display = 'none';
      inputQ.disabled = false;
      submitBtn.disabled = false;

      const q = new URLSearchParams(location.search).get('q') ?? '';
      if (q) inputQ.value = q;
      handleQuery(q);
    } catch (err) {
      loading.textContent = `Initialization failed: ${err.message}`;
    }
  }

  function handleQuery(q) {
    q = (q ?? '').trim();
    if (!pyAnalyze) return;
    content.innerHTML = !q
      ? help
      : q === 'isotopes' ? pyIsotopes()
      : q === 'groups'   ? pyGroups()
      : pyAnalyze(q);
  }

  function navigate(q) {
    q = q.trim();
    inputQ.value = q;
    history.pushState({ q }, '', q ? `?q=${encodeURIComponent(q)}` : location.pathname);
    handleQuery(q);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    navigate(inputQ.value);
  });

  document.getElementById('r').addEventListener('click', () => navigate(''));

  // intercept ?q= links in generated content for SPA navigation
  content.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const m = a.getAttribute('href').match(/^\?q=(.*)$/);
    if (m) { e.preventDefault(); navigate(decodeURIComponent(m[1])); }
  });

  window.addEventListener('popstate', (e) => {
    const q = e.state?.q ?? new URLSearchParams(location.search).get('q') ?? '';
    inputQ.value = q;
    handleQuery(q);
  });

  init();
})();
</script>
</body>
